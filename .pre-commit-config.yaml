# Setup: uvx prek install
# Run:   uvx prek run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: generated-migrations
        name: generated migration watermark and drift
        entry: pnpm db check
        language: system
        always_run: true
        pass_filenames: false
      - id: generated-workflows
        name: Hollywood workflow drift
        entry: pnpm exec hollywood check --generated --source-root gha
        language: system
        always_run: true
        pass_filenames: false
      - id: lint
        name: oxlint
        entry: pnpm --filter @schedule.pizza/web lint
        language: system
        files: \.(tsx?|jsx?)$
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: pnpm --filter @schedule.pizza/web typecheck
        language: system
        files: \.(tsx?|jsx?)$
        pass_filenames: false
